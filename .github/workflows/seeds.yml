name: Seeds de prueba

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-fixture:
    if: github.repository == 'rogerex007/orbivista' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: orbivista-seeds-fixture
    steps:
      - name: Descargar la rama seeds
        uses: actions/checkout@v4
        with:
          ref: seeds
      - name: Publicar el JSON de prueba
        run: |
          set -euo pipefail
          if [[ -e seeds.json ]]; then
            jq -e '. == {at: 0, seeds: []}' seeds.json >/dev/null
            echo 'El JSON de prueba ya está publicado.'
            exit 0
          fi
          printf '%s\n' '{"at":0,"seeds":[]}' > seeds.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- seeds.json
          git commit -m 'Add empty seeds fixture'
          git push origin HEAD:refs/heads/seeds
